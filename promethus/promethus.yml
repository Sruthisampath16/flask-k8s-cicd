global:
  scrape_interval: 15s 
  evaluation_interval: 15s
alerting:
  altermanagers:
    - static_configs:
        - targets:
            - alertmanager: 9093
rule_files:
  - "alerts.yml"
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'node-exporter'      
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'myapp'
    static_configs:
      - targets: ['myapp:8080']
  - job_name: 'alertmanager'
    static_config:
      - targets: ['alertmanager:9093']
        