name: Deploy Monitoring Stack
on:
  push:
    branches:
      - main
    paths:
      - 'prometheus/**'
      - 'altertmanager/**'
      - 'docker-compose.yml'
jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout

      - name: Deploy monitoring to server 
        uses: appleboy/ssh-action@0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /path/to/your/monitoring
            docker-compose down
            docker-compose pull
            docker-compose up -d
            docker compose ps 
      - name: Notify sucess
        if: sucess()
        run: echo"its sucess"
      - name: Notify failure
        if: failure()
        run: echo "Monitoring deployment failed! Check logs!"



